name: update-mihomo

on:
  schedule:
    # Saturday 04:17 Asia/Shanghai, one day before the myfeed refresh.
    - cron: "17 20 * * 5"
  workflow_dispatch:
    inputs:
      verify_source:
        description: Verify the source checksum even when the stable version is current
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nikki-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: checkout this fork
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: test automatic updates
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bash .github/scripts/verify-compatibility.sh
          sh -n feed.sh install.sh

      - name: check the latest stable Mihomo release
        id: update
        env:
          VERIFY_SOURCE: ${{ inputs.verify_source || false }}
        run: |
          args=()
          if [ "$VERIFY_SOURCE" = true ]; then
            args+=(--verify-source)
          fi
          python3 .github/scripts/update-mihomo.py "${args[@]}"

      - name: prepare the source commit
        if: steps.update.outputs.build == 'true'
        id: source
        env:
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
          CHANGED: ${{ steps.update.outputs.changed }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          git diff --check
          if [ "$CHANGED" = true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -c commit.gpgsign=false commit -m "chore: update mihomo-meta to v$VERSION" \
              -- mihomo-meta/Makefile .github/mihomo-release.json
          fi
          # Resume an incomplete release from its original source commit.
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            if [ "$CHANGED" = true ]; then
              echo '::error::The new release tag already exists; refusing to change its source.'
              exit 1
            fi
            git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD \
              -- mihomo-meta/Makefile nikki/Makefile luci-app-nikki/Makefile
            git checkout --detach "refs/tags/$RELEASE_TAG"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: build the release packages
        if: steps.update.outputs.build == 'true'
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: nikki
          PACKAGES: luci-app-nikki
          INDEX: 1
          NO_REFRESH_CHECK: true

      - name: verify and archive the release
        if: steps.update.outputs.build == 'true'
        run: |
          bash .github/scripts/verify-packages.sh bin/packages/x86_64/nikki
          tar -czf nikki_x86_64-openwrt-25.12.tar.gz -C bin/packages/x86_64/nikki .
          sha256sum nikki_x86_64-openwrt-25.12.tar.gz

      - name: retain the verified archive
        if: steps.update.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nikki_x86_64-openwrt-25.12
          path: nikki_x86_64-openwrt-25.12.tar.gz

      - name: publish the verified source and release
        if: steps.update.outputs.build == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
          VERSION: ${{ steps.update.outputs.version }}
          CHANGED: ${{ steps.update.outputs.changed }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
        run: |
          if [ "$CHANGED" = true ]; then
            git fetch origin "$DEFAULT_BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
              echo '::error::The default branch changed during the build. Rerun to build the new source.'
              exit 1
            fi
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          printf 'OpenWrt 25.12 / x86_64\n\nMihomo: v%s\n\n自动检查稳定版并构建，保留本 fork 的 Nikki 功能和兼容处理。\n' \
            "$VERSION" > "$RUNNER_TEMP/nikki-release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" nikki_x86_64-openwrt-25.12.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Publish only after the complete archive is uploaded successfully.
            gh release create "$RELEASE_TAG" nikki_x86_64-openwrt-25.12.tar.gz \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/nikki-release-notes.md"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest
          printf 'Published [%s](https://github.com/%s/releases/tag/%s).\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
